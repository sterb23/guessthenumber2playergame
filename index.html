<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAME SPOT</title>
    <!-- PeerJS for instant Room Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --surface-hover: #141414;
            --border: #222222;
            --border-bright: #ffffff;
            --text: #ffffff;
            --text-dim: #666666;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            overflow-x: hidden;
        }

        /* Screen Transitions */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 440px;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Typography */
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            margin-bottom: 6px;
            text-align: center;
        }

        .tagline {
            font-size: 0.85rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 36px;
            text-align: center;
        }

        /* Cards & UI Elements */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            flex: 1;
            transition: border-color 0.2s ease;
        }

        input:focus {
            border-color: var(--border-bright);
        }

        input.code-input {
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        button {
            background: var(--text);
            color: var(--bg);
            border: 1px solid var(--text);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        button:hover {
            background: #e6e6e6;
            transform: translateY(-1px);
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background: transparent;
            color: var(--text);
            border-color: var(--border);
        }

        button.secondary:hover {
            border-color: var(--border-bright);
            background: var(--surface-hover);
        }

        .divider {
            display: flex;
            align-items: center;
            color: var(--text-dim);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin: 4px 0;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
            margin: 0 12px;
        }

        .room-code-badge {
            background: var(--surface);
            border: 1px dashed var(--border-bright);
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            user-select: all;
        }

        /* HUD & Vector Hearts */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 24px;
            padding: 0 4px;
        }

        .lives-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .heart-svg {
            width: 22px;
            height: 22px;
            fill: var(--text);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .heart-svg.lost {
            fill: transparent;
            stroke: var(--border);
            stroke-width: 2;
            transform: scale(0.75);
            opacity: 0.3;
        }

        .status-badge {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        /* Board & Circles Grid */
        .board-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            width: 100%;
        }

        .circle {
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            opacity: 0;
            animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: calc(var(--i) * 0.025s);
            transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }

        .circle:hover:not(.disabled) {
            border-color: var(--border-bright);
            transform: scale(1.08);
            background: var(--surface-hover);
        }

        .circle:active:not(.disabled) {
            transform: scale(0.95);
        }

        .circle.disabled {
            cursor: default;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        .circle.wrong {
            background: #180000;
            border-color: #ff3333;
            color: #ff3333;
            animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        .circle.correct {
            background: #ffffff;
            border-color: #ffffff;
            color: #000000;
            font-weight: 900;
            animation: winPulse 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes shake {
            10%, 90% { transform: translateX(-2px); }
            20%, 80% { transform: translateX(4px); }
            30%, 50%, 70% { transform: translateX(-4px); }
            40%, 60% { transform: translateX(4px); }
        }

        @keyframes winPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1.08); }
        }

        /* Minimalist Chat Component */
        .chat-card {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-messages {
            height: 100px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .chat-msg {
            font-size: 0.8rem;
            line-height: 1.3;
            word-break: break-word;
        }

        .chat-msg .sender {
            font-weight: 700;
            color: var(--text-dim);
            margin-right: 6px;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
        }

        .chat-msg.me .sender {
            color: var(--text);
        }

        .chat-form {
            display: flex;
            gap: 8px;
        }

        /* Local Split Screen Mode */
        .split-container {
            display: none;
            gap: 32px;
            width: 100%;
            max-width: 900px;
        }

        .split-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .split-title {
            font-size: 0.8rem;
            color: var(--text-dim);
            letter-spacing: 0.1em;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            .board-grid {
                gap: 8px;
            }
            .circle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="screen active">
        <h1>SAME SPOT</h1>
        <div class="tagline">Ultra Minimalist Multiplayer</div>

        <div class="card">
            <button onclick="createRoom()">Create New Room</button>
            <div class="divider">or join with code</div>
            <div class="input-group">
                <input type="text" id="room-input" class="code-input" placeholder="CODE" maxlength="4" autocomplete="off">
                <button class="secondary" onclick="joinRoomInput()">Join</button>
            </div>
        </div>

        <button class="secondary" style="width: 100%;" onclick="startLocalMode()">Offline Split-Screen</button>
    </div>

    <!-- WAITING ROOM SCREEN -->
    <div id="waiting-screen" class="screen">
        <h1>ROOM CREATED</h1>
        <div class="tagline">Share code with your opponent</div>

        <div class="card">
            <div class="room-code-badge" id="code-display">----</div>
            <button class="secondary" onclick="copyRoomLink()">Copy Invite Link</button>
        </div>

        <div class="status-badge" id="waiting-status">Waiting for player 2 to join...</div>
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div id="game-screen" class="screen">
        <div class="hud">
            <div class="lives-container" id="lives-box">
                <svg class="heart-svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <svg class="heart-svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <svg class="heart-svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>
            <div class="status-badge" id="game-status">FIND THE MATCH</div>
        </div>

        <!-- Single View Grid -->
        <div id="single-board" class="board-grid"></div>

        <!-- Local Split View -->
        <div id="split-board" class="split-container">
            <div class="split-column">
                <div class="split-title">Player 1</div>
                <div id="p1-grid" class="board-grid"></div>
            </div>
            <div class="split-column">
                <div class="split-title">Player 2</div>
                <div id="p2-grid" class="board-grid"></div>
            </div>
        </div>

        <button id="restart-btn" style="margin-top: 20px; width: 100%; display: none;" onclick="restartGame()">Play Again</button>

        <!-- Live Chat Section -->
        <div id="chat-box" class="chat-card">
            <div class="chat-messages" id="chat-messages">
                <div class="chat-msg"><span class="sender">System</span>Connected to room chat.</div>
            </div>
            <form class="chat-form" onsubmit="sendChatMessage(event)">
                <input type="text" id="chat-input" placeholder="Type message..." autocomplete="off">
                <button type="submit" class="secondary">Send</button>
            </form>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let roomCode = "";
        let isHost = false;
        let myBoard = [];
        let targetIndex = -1;
        let lives = 3;
        let gameOver = false;
        let isLocalMode = false;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function generateCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 4; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function createRoom() {
            roomCode = generateCode();
            isHost = true;

            document.getElementById('code-display').innerText = roomCode;
            showScreen('waiting-screen');

            peer = new Peer('samespot-v2-' + roomCode);

            peer.on('open', () => {
                document.getElementById('waiting-status').innerText = "Waiting for Player 2...";
            });

            peer.on('connection', (c) => {
                conn = c;
                setupConnection();
                startNewMatch();
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    createRoom();
                } else {
                    alert("Error creating room. Please try again.");
                    showScreen('lobby-screen');
                }
            });
        }

        function joinRoomInput() {
            const code = document.getElementById('room-input').value.trim().toUpperCase();
            if (code.length !== 4) {
                alert("Please enter a valid 4-character code.");
                return;
            }
            joinRoom(code);
        }

        function joinRoom(code) {
            roomCode = code;
            isHost = false;
            peer = new Peer();

            peer.on('open', () => {
                conn = peer.connect('samespot-v2-' + code);
                setupConnection();
            });

            peer.on('error', () => {
                alert("Could not connect to room. Check the code and try again.");
                showScreen('lobby-screen');
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                showScreen('game-screen');
            });

            conn.on('data', (data) => {
                if (data.type === 'START_GAME') {
                    myBoard = data.board;
                    targetIndex = data.targetIndex;
                    resetGameState();
                    renderBoard('single-board', myBoard, handleGuess);
                    showScreen('game-screen');
                } else if (data.type === 'WIN') {
                    gameOver = true;
                    document.getElementById('game-status').innerText = "OPPONENT FOUND IT FIRST!";
                    highlightTarget();
                    if (isHost) document.getElementById('restart-btn').style.display = 'block';
                } else if (data.type === 'CHAT') {
                    appendChatMessage('Opponent', data.text, false);
                }
            });
        }

        // Chat functionality
        function sendChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            appendChatMessage('You', text, true);

            if (conn && conn.open) {
                conn.send({ type: 'CHAT', text: text });
            }

            input.value = '';
        }

        function appendChatMessage(sender, text, isMe) {
            const box = document.getElementById('chat-messages');
            const msgEl = document.createElement('div');
            msgEl.className = `chat-msg ${isMe ? 'me' : ''}`;
            msgEl.innerHTML = `<span class="sender">${sender}</span>${escapeHTML(text)}`;
            box.appendChild(msgEl);
            box.scrollTop = box.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function generateGameData() {
            const targetIndex = Math.floor(Math.random() * 20);
            let masterPool = Array.from({length: 90}, (_, i) => i + 10).sort(() => Math.random() - 0.5);
            const targetNum = masterPool.pop();

            let p1Board = new Array(20);
            let p2Board = new Array(20);

            p1Board[targetIndex] = targetNum;
            p2Board[targetIndex] = targetNum;

            for (let i = 0; i < 20; i++) {
                if (i !== targetIndex) {
                    p1Board[i] = masterPool.pop();
                }
            }

            let p2Pool = Array.from({length: 90}, (_, i) => i + 10)
                .filter(n => n !== targetNum)
                .sort(() => Math.random() - 0.5);

            for (let i = 0; i < 20; i++) {
                if (i !== targetIndex) {
                    let matchIdx = p2Pool.findIndex(n => n !== p1Board[i]);
                    p2Board[i] = p2Pool.splice(matchIdx, 1)[0];
                }
            }

            return { targetIndex, p1Board, p2Board };
        }

        function startNewMatch() {
            const data = generateGameData();
            targetIndex = data.targetIndex;
            myBoard = data.p1Board;

            conn.send({
                type: 'START_GAME',
                board: data.p2Board,
                targetIndex: data.targetIndex
            });

            resetGameState();
            renderBoard('single-board', myBoard, handleGuess);
        }

        function handleGuess(index, el) {
            if (gameOver || el.classList.contains('disabled')) return;

            if (index === targetIndex) {
                el.classList.add('correct');
                gameOver = true;
                document.getElementById('game-status').innerText = "YOU WON!";
                document.getElementById('restart-btn').style.display = 'block';
                if (!isLocalMode && conn) conn.send({ type: 'WIN' });
            } else {
                el.classList.add('wrong', 'disabled');
                lives--;
                updateHeartsUI();
                if (lives <= 0) {
                    gameOver = true;
                    document.getElementById('game-status').innerText = "GAME OVER";
                    highlightTarget();
                    if (isHost || isLocalMode) document.getElementById('restart-btn').style.display = 'block';
                }
            }
        }

        function highlightTarget() {
            const container = isLocalMode ? document.getElementById('p1-grid') : document.getElementById('single-board');
            const circles = container.getElementsByClassName('circle');
            if (circles[targetIndex]) {
                circles[targetIndex].classList.add('correct');
            }
        }

        function resetGameState() {
            lives = 3;
            gameOver = false;
            updateHeartsUI();
            document.getElementById('game-status').innerText = "FIND THE MATCH";
            document.getElementById('restart-btn').style.display = 'none';
        }

        function updateHeartsUI() {
            const hearts = document.querySelectorAll('#lives-box .heart-svg');
            hearts.forEach((heart, i) => {
                if (i < lives) {
                    heart.classList.remove('lost');
                } else {
                    heart.classList.add('lost');
                }
            });
        }

        function renderBoard(containerId, boardData, clickHandler) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            boardData.forEach((num, index) => {
                const circle = document.createElement('div');
                circle.className = 'circle';
                circle.style.setProperty('--i', index);
                circle.innerText = num;
                circle.onclick = () => clickHandler(index, circle);
                container.appendChild(circle);
            });
        }

        function copyRoomLink() {
            const url = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            navigator.clipboard.writeText(url);
            alert("Room link copied to clipboard!");
        }

        function restartGame() {
            if (isLocalMode) {
                startLocalMode();
            } else if (isHost) {
                startNewMatch();
            }
        }

        function startLocalMode() {
            isLocalMode = true;
            document.getElementById('single-board').style.display = 'none';
            document.getElementById('split-board').style.display = 'flex';
            document.getElementById('chat-box').style.display = 'none';
            showScreen('game-screen');

            const data = generateGameData();
            targetIndex = data.targetIndex;
            resetGameState();

            renderBoard('p1-grid', data.p1Board, (idx, el) => handleGuess(idx, el));
            renderBoard('p2-grid', data.p2Board, (idx, el) => handleGuess(idx, el));
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam && roomParam.length === 4) {
                document.getElementById('room-input').value = roomParam.toUpperCase();
                joinRoom(roomParam.toUpperCase());
            }
        });
    </script>
</body>
</html>
