<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAME SPOT - Co-Op</title>
    <style>
        :root {
            --bg: #050505;
            --surface: #0f0f11;
            --surface-hover: #1a1a1e;
            --border: #222228;
            --border-bright: #ffffff;
            --text: #ffffff;
            --text-dim: #71717a;
            --radius: 16px;
            --green: #00ff66;
            --yellow: #ffcc00;
            --red: #ff3333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        body::before {
            content: '';
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 255, 102, 0.03) 0%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 440px;
            z-index: 1;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            margin-bottom: 4px;
            text-align: center;
            background: linear-gradient(180deg, #FFFFFF 0%, #A1A1AA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 24px;
            text-align: center;
            font-weight: 600;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            width: 100%;
            transition: all 0.2s ease;
            user-select: text;
            -webkit-user-select: text;
        }

        input:focus {
            border-color: var(--border-bright);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
        }

        button {
            background: var(--text);
            color: var(--bg);
            border: 1px solid var(--text);
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            width: 100%;
            transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover { background: #e6e6e6; transform: translateY(-1px); }
        button:active { transform: scale(0.97); }

        button.secondary {
            background: transparent;
            color: var(--text);
            border-color: var(--border);
        }
        button.secondary:hover { border-color: var(--border-bright); background: var(--surface-hover); }

        button.accent { background: transparent; color: var(--green); border-color: var(--green); }
        button.accent:hover { background: rgba(0, 255, 102, 0.1); }
        
        button.text-only { background: transparent; border: none; color: var(--text-dim); font-size: 0.75rem; letter-spacing: 0.08em; padding: 8px; width: auto; }
        button.text-only:hover { color: var(--text); transform: none; }

        button.small-btn { padding: 8px 12px; font-size: 0.7rem; width: auto; border-radius: 8px; }

        .icon-svg { width: 16px; height: 16px; stroke-width: 2.2; flex-shrink: 0; }

        .divider {
            display: flex; align-items: center; color: var(--text-dim); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin: 4px 0;
        }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); margin: 0 12px; }

        /* Profile & Friends UI */
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 16px;
            width: 100%;
        }

        .profile-info { display: flex; flex-direction: column; }
        .profile-name { font-size: 1.1rem; font-weight: 800; color: var(--text); }
        .profile-user { font-size: 0.8rem; font-weight: 600; color: var(--green); letter-spacing: 0.05em; margin-top: 2px;}

        .friend-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px;
        }
        .friend-item-info { display: flex; flex-direction: column; }
        .friend-handle { font-size: 0.9rem; font-weight: 700; color: var(--text); }
        
        .add-friend-row { display: flex; gap: 8px; margin-top: 8px; }

        .online-dot {
            width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); display: inline-block; margin-right: 6px;
        }
        .online-dot.active { background: var(--green); box-shadow: 0 0 8px rgba(0, 255, 102, 0.6); }

        /* Modal Overlays */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 5, 0.88); backdrop-filter: blur(8px);
            z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active { display: flex; }

        .invite-modal {
            background: var(--surface); border: 1px solid var(--green); border-radius: var(--radius);
            padding: 24px; width: 100%; max-width: 320px; text-align: center;
            box-shadow: 0 0 40px rgba(0, 255, 102, 0.15);
        }
        
        /* Game HUD & Board */
        .hud { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; margin-bottom: 16px; }
        .hud-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .lives-container { display: flex; gap: 6px; align-items: center; background: var(--surface); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); }
        .heart-svg { width: 20px; height: 20px; fill: var(--text); transition: all 0.4s ease; }
        .heart-svg.lost { fill: transparent; stroke: var(--border); stroke-width: 2; transform: scale(0.75); opacity: 0.3; }
        
        .turn-banner { font-size: 0.75rem; font-weight: 800; letter-spacing: 0.1em; padding: 6px 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); color: var(--yellow); }
        .turn-banner.my-turn { color: var(--bg); background: var(--green); border-color: var(--green); }
        .status-badge { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; color: var(--text-dim); text-transform: uppercase; }

        .board-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; transition: opacity 0.3s ease; }
        .board-grid.turn-disabled { opacity: 0.35; pointer-events: none; }
        
        .circle {
            aspect-ratio: 1; border-radius: 50%; background: var(--surface); border: 1px solid var(--border);
            color: var(--text); font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; justify-content: center;
            cursor: pointer; opacity: 0; animation: popIn 0.4s forwards; animation-delay: calc(var(--i) * 0.015s);
            transition: transform 0.2s, border-color 0.2s, background-color 0.2s;
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: scale(1); } }
        
        .circle:active:not(.disabled) { transform: scale(0.92); }
        .circle.wrong { background: #2a0808; border-color: var(--red); color: var(--red); }
        .circle.correct { background: var(--green) !important; border-color: var(--green) !important; color: #000 !important; opacity: 1 !important; box-shadow: 0 0 25px rgba(0, 255, 102, 0.9); z-index: 10; transform: scale(1.15); }
        .circle.fade-out { opacity: 0 !important; transform: scale(0.3) !important; pointer-events: none; }
        .circle.disabled { cursor: default; }

        /* Chat */
        .chat-card { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
        .chat-messages { height: 85px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .chat-msg { font-size: 0.8rem; line-height: 1.3; }
        .chat-msg .sender { font-weight: 700; color: var(--text-dim); margin-right: 6px; font-size: 0.65rem; text-transform: uppercase; }
        .chat-msg.me .sender { color: var(--green); }
        .chat-form { display: flex; gap: 8px; }
        
        @media (min-width: 768px) {
            body { padding: 40px; }
            #game-screen { max-width: 860px; grid-template-columns: 1fr 300px; grid-template-rows: auto 1fr auto; gap: 20px; align-items: start; }
            #game-screen.active { display: grid; }
            #game-screen .hud { grid-column: 1 / -1; }
            #single-board { grid-column: 1 / 2; }
            #chat-box { grid-column: 2 / 3; height: 100%; justify-content: space-between; margin-top: 0; }
            .chat-messages { height: 240px; }
            #restart-btn { grid-column: 1 / -1; }
        }
    </style>
</head>
<body>

    <!-- INITIAL SETUP SCREEN -->
    <div id="setup-screen" class="screen">
        <h1>WELCOME</h1>
        <div class="tagline">Create your profile to join the network</div>

        <div class="card">
            <label style="font-size: 0.75rem; color: var(--text-dim); margin-left: 4px; font-weight: 700;">DISPLAY NAME</label>
            <input type="text" id="setup-displayname" placeholder="How others see you" maxlength="16" autocomplete="off">
            
            <label style="font-size: 0.75rem; color: var(--text-dim); margin-left: 4px; margin-top: 8px; font-weight: 700;">USERNAME</label>
            <input type="text" id="setup-username" placeholder="@TTVsteph2K" maxlength="15" autocomplete="off">
            
            <button style="margin-top: 12px;" onclick="saveProfile()">Continue</button>
        </div>
    </div>

    <!-- MAIN HUB (FRIENDS & LOBBY) -->
    <div id="hub-screen" class="screen">
        <div class="profile-header">
            <div class="profile-info">
                <div class="profile-name" id="hub-displayname">Player</div>
                <div class="profile-user" id="hub-username">@player</div>
            </div>
            <button class="text-only" onclick="editProfile()">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
        </div>

        <div class="card">
            <h3 style="font-size: 0.9rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; display: flex; align-items: center; gap: 6px;">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Friends List
            </h3>
            
            <div id="friends-list-container"></div>

            <div class="divider">add new friend</div>
            <div class="add-friend-row">
                <input type="text" id="add-friend-input" placeholder="@playersname" style="flex: 1;" autocomplete="off">
                <button class="secondary" style="width: auto;" onclick="addFriend()">Add</button>
            </div>
        </div>
        
        <div class="status-badge" id="hub-status-text" style="margin-bottom: 16px;">
            <span class="online-dot active"></span> Network Active (Cross-Tab & Local Ready)
        </div>
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div id="game-screen" class="screen">
        <div class="hud">
            <div class="hud-top">
                <div class="lives-container" id="lives-box">
                    <svg class="heart-svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <svg class="heart-svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <svg class="heart-svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <div id="turn-banner" class="turn-banner">YOUR TURN</div>
                <button class="text-only" onclick="exitGame()">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    LEAVE
                </button>
            </div>
            <div class="status-badge" id="game-status">FIND THE 1 MATCHING SPOT</div>
        </div>

        <div id="single-board" class="board-grid"></div>

        <div id="chat-box" class="chat-card">
            <div class="chat-messages" id="chat-messages">
                <div class="chat-msg"><span class="sender">System</span>Connected to partner.</div>
            </div>
            <form class="chat-form" onsubmit="sendChatMessage(event)">
                <input type="text" id="chat-input" placeholder="Type message..." autocomplete="off">
                <button type="submit" class="secondary">Send</button>
            </form>
        </div>

        <button id="restart-btn" style="display: none; margin-top: 16px;" onclick="hostRematch()">Play Again</button>
    </div>

    <!-- INCOMING INVITE MODAL -->
    <div id="invite-modal" class="modal-overlay">
        <div class="invite-modal">
            <svg class="icon-svg" style="width: 32px; height: 32px; color: var(--green); margin-bottom: 12px;" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <h2 style="font-size: 1.2rem; margin-bottom: 4px;">Game Invite</h2>
            <p style="font-size: 0.9rem; color: var(--text-dim); margin-bottom: 24px;" id="invite-caller-text">@player wants to play!</p>
            
            <div style="display: flex; gap: 10px;">
                <button class="secondary" onclick="declineInvite()">Decline</button>
                <button class="accent" onclick="acceptInvite()">Accept</button>
            </div>
        </div>
    </div>

    <script>
        let myProfile = { displayName: '', username: '' };
        let friendsList = [];
        
        let broadcastChannel = null;
        let activeConnection = null; // Direct messaging channel wrapper
        let pendingInviteData = null;
        
        let isHost = false;
        let partnerProfile = { displayName: 'Partner', username: '' };
        
        // Gameplay State
        let myBoard = [];
        let targetIndex = -1;
        let lives = 3;
        let gameOver = false;
        let activeTurn = 'host';

        window.onload = () => {
            loadData();
            if (myProfile.username) {
                showHub();
            } else {
                showScreen('setup-screen');
            }
        };

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function loadData() {
            const savedProfile = localStorage.getItem('samespot_profile');
            if (savedProfile) myProfile = JSON.parse(savedProfile);
            const savedFriends = localStorage.getItem('samespot_friends');
            if (savedFriends) friendsList = JSON.parse(savedFriends);
        }

        function saveData() {
            localStorage.setItem('samespot_profile', JSON.stringify(myProfile));
            localStorage.setItem('samespot_friends', JSON.stringify(friendsList));
        }

        function saveProfile() {
            const dName = document.getElementById('setup-displayname').value.trim();
            let uName = document.getElementById('setup-username').value.trim();
            
            if (!dName || !uName) { alert("Please fill out both fields."); return; }
            if (!uName.startsWith('@')) uName = '@' + uName;
            uName = uName.replace(/\s+/g, '').toLowerCase();
            
            myProfile = { displayName: dName, username: uName };
            saveData();
            showHub();
        }

        function editProfile() {
            document.getElementById('setup-displayname').value = myProfile.displayName;
            document.getElementById('setup-username').value = myProfile.username;
            if (broadcastChannel) broadcastChannel.close();
            showScreen('setup-screen');
        }

        function showHub() {
            document.getElementById('hub-displayname').textContent = myProfile.displayName;
            document.getElementById('hub-username').textContent = myProfile.username;
            renderFriendsList();
            showScreen('hub-screen');
            initMessaging();
        }

        function addFriend() {
            let tag = document.getElementById('add-friend-input').value.trim();
            if (!tag) return;
            if (!tag.startsWith('@')) tag = '@' + tag;
            tag = tag.replace(/\s+/g, '').toLowerCase();

            if (tag === myProfile.username.toLowerCase()) {
                alert("You can't add yourself!");
                return;
            }

            if (!friendsList.includes(tag)) {
                friendsList.push(tag);
                saveData();
                renderFriendsList();
            }
            document.getElementById('add-friend-input').value = '';
        }

        function removeFriend(tag) {
            friendsList = friendsList.filter(f => f !== tag);
            saveData();
            renderFriendsList();
        }

        function renderFriendsList() {
            const container = document.getElementById('friends-list-container');
            container.innerHTML = '';
            
            if (friendsList.length === 0) {
                container.innerHTML = '<div style="font-size:0.8rem; color:var(--text-dim); text-align:center; padding:10px;">No friends added yet.</div>';
                return;
            }

            friendsList.forEach(fTag => {
                const row = document.createElement('div');
                row.className = 'friend-item';
                row.innerHTML = `
                    <div class="friend-item-info">
                        <span class="friend-handle">${fTag}</span>
                    </div>
                    <div style="display:flex; gap:6px;">
                        <button class="accent small-btn" onclick="inviteFriend('${fTag}')">Invite</button>
                        <button class="secondary small-btn" onclick="removeFriend('${fTag}')">
                            <svg class="icon-svg" style="width:14px; height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // --- Reliable Local/Cross-Tab Bridge System ---
        function initMessaging() {
            if (broadcastChannel) broadcastChannel.close();
            
            broadcastChannel = new BroadcastChannel('samespot_network_channel');
            broadcastChannel.onmessage = (event) => {
                const data = event.data;
                if (!data || !data.targetUser) return;

                // Check if message is intended for this user
                if (data.targetUser.toLowerCase() === myProfile.username.toLowerCase()) {
                    if (data.type === 'INVITE') {
                        pendingInviteData = data;
                        partnerProfile = { displayName: data.fromDisplay, username: data.fromUser };
                        showInviteModal();
                    } else if (data.type === 'ACCEPT') {
                        if (window.pendingInviteBtn) {
                            window.pendingInviteBtn.textContent = "Joined!";
                        }
                        isHost = true;
                        partnerProfile = { displayName: data.fromDisplay, username: data.fromUser };
                        setupDirectConnection(data.fromUser);
                        startNewMatch();
                    } else if (data.type === 'DECLINE') {
                        if (window.pendingInviteBtn) {
                            window.pendingInviteBtn.textContent = "Declined";
                            setTimeout(() => {
                                window.pendingInviteBtn.textContent = "Invite";
                                window.pendingInviteBtn.disabled = false;
                            }, 2000);
                        }
                        alert(`${data.fromUser} declined your invite.`);
                    } else if (activeConnection && data.type === 'GAME_MSG') {
                        handleIncomingGameMessage(data.payload);
                    }
                }
            };
        }

        function inviteFriend(friendTag) {
            const btn = event.currentTarget;
            window.pendingInviteBtn = btn;
            btn.textContent = "Calling...";
            btn.disabled = true;

            broadcastChannel.postMessage({
                targetUser: friendTag,
                type: 'INVITE',
                fromUser: myProfile.username,
                fromDisplay: myProfile.displayName
            });

            setTimeout(() => {
                if (btn.disabled && btn.textContent === "Calling...") {
                    btn.textContent = "Invite";
                    btn.disabled = false;
                    alert("No response from player (make sure they have the app open in another tab or window!).");
                }
            }, 10000);
        }

        function showInviteModal() {
            document.getElementById('invite-caller-text').textContent = `${partnerProfile.displayName} (${partnerProfile.username}) wants to play!`;
            document.getElementById('invite-modal').classList.add('active');
        }

        function hideInviteModal() {
            document.getElementById('invite-modal').classList.remove('active');
        }

        function acceptInvite() {
            broadcastChannel.postMessage({
                targetUser: partnerProfile.username,
                type: 'ACCEPT',
                fromUser: myProfile.username,
                fromDisplay: myProfile.displayName
            });

            isHost = false;
            setupDirectConnection(partnerProfile.username);
            hideInviteModal();
            showScreen('game-screen');
            document.getElementById('game-status').textContent = "Waiting for host to start match...";
            document.getElementById('single-board').style.display = 'none';
        }

        function declineInvite() {
            if (pendingInviteData) {
                broadcastChannel.postMessage({
                    targetUser: pendingInviteData.fromUser,
                    type: 'DECLINE',
                    fromUser: myProfile.username
                });
            }
            hideInviteModal();
        }

        function setupDirectConnection(partnerUser) {
            activeConnection = {
                partner: partnerUser,
                send: (payload) => {
                    broadcastChannel.postMessage({
                        targetUser: partnerUser,
                        type: 'GAME_MSG',
                        payload: payload
                    });
                }
            };
        }

        function handleIncomingGameMessage(data) {
            if (data.type === 'START_GAME') {
                myBoard = data.board;
                targetIndex = data.targetIndex;
                resetGameState();
                renderBoard('single-board', myBoard, (idx, el) => handleGuess(idx, el));
                document.getElementById('single-board').style.display = 'grid';
                if (document.getElementById('chat-messages').children.length <= 1) {
                    addSystemChat(`Connected to ${partnerProfile.displayName}.`);
                }
            } 
            else if (data.type === 'GUESS') {
                const el = document.getElementById('single-board').children[data.index];
                if (el) applyGuessResult(data.index, el, false);
            } 
            else if (data.type === 'CHAT') {
                addChatMessage(partnerProfile.displayName, data.message, false);
            }
        }

        // --- Gameplay Logic ---

        function generateGameData() {
            const targetIdx = Math.floor(Math.random() * 20);
            const pool = [];
            while(pool.length < 20) {
                let r = Math.floor(Math.random() * 90) + 10;
                if(!pool.includes(r)) pool.push(r);
            }
            const targetNum = pool[0];
            const others = pool.slice(1); 
            
            let p1Others = [...others].sort(() => Math.random() - 0.5);
            let p2Others = [];
            
            let valid = false;
            while(!valid) {
                p2Others = [...p1Others].sort(() => Math.random() - 0.5);
                valid = true;
                for(let i=0; i<19; i++) {
                    if(p1Others[i] === p2Others[i]) { valid = false; break; }
                }
            }
            
            let p1Board = new Array(20), p2Board = new Array(20);
            let oIdx = 0;
            for(let i = 0; i < 20; i++) {
                if(i === targetIdx) { p1Board[i] = p2Board[i] = targetNum; } 
                else { p1Board[i] = p1Others[oIdx]; p2Board[i] = p2Others[oIdx]; oIdx++; }
            }
            return { targetIndex: targetIdx, p1Board, p2Board };
        }

        function startNewMatch() {
            const data = generateGameData();
            targetIndex = data.targetIndex;
            myBoard = data.p1Board;

            if (activeConnection) {
                activeConnection.send({
                    type: 'START_GAME',
                    board: data.p2Board,
                    targetIndex: data.targetIndex
                });
            }

            resetGameState();
            document.getElementById('single-board').style.display = 'grid';
            renderBoard('single-board', myBoard, (idx, el) => handleGuess(idx, el));
            showScreen('game-screen');
        }

        function hostRematch() {
            if (isHost) startNewMatch();
        }

        function renderBoard(containerId, boardData, clickHandler) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            boardData.forEach((num, index) => {
                const div = document.createElement('div');
                div.className = 'circle';
                div.textContent = num;
                div.style.setProperty('--i', index);
                div.onclick = () => {
                    if (gameOver || div.classList.contains('disabled')) return;
                    if (navigator.vibrate) navigator.vibrate(12);
                    clickHandler(index, div);
                };
                container.appendChild(div);
            });
        }

        function resetGameState() {
            lives = 3;
            gameOver = false;
            activeTurn = 'host';
            document.getElementById('restart-btn').style.display = 'none';
            document.getElementById('game-status').textContent = 'FIND THE 1 MATCHING SPOT';
            updateTurnUI();
            updateLivesUI();
        }

        function updateTurnUI() {
            const banner = document.getElementById('turn-banner');
            const singleBoard = document.getElementById('single-board');
            const isMyTurn = (isHost && activeTurn === 'host') || (!isHost && activeTurn === 'guest');
            
            if (isMyTurn) {
                banner.textContent = "YOUR TURN";
                banner.classList.add('my-turn');
                singleBoard.classList.remove('turn-disabled');
            } else {
                banner.textContent = `${partnerProfile.displayName.toUpperCase()}'S TURN`;
                banner.classList.remove('my-turn');
                singleBoard.classList.add('turn-disabled');
            }
        }

        function updateLivesUI() {
            document.querySelectorAll('.heart-svg').forEach((h, i) => {
                if (i < lives) h.classList.remove('lost');
                else h.classList.add('lost');
            });
            if (lives <= 0 && !gameOver) { gameOver = true; handleLoss(); }
        }

        function handleGuess(index, el) {
            const isMyTurn = (isHost && activeTurn === 'host') || (!isHost && activeTurn === 'guest');
            if (!isMyTurn) return;

            applyGuessResult(index, el, true);
            if (activeConnection) activeConnection.send({ type: 'GUESS', index: index });
        }

        function applyGuessResult(index, element, isMe) {
            if (gameOver) return;

            if (index === targetIndex) {
                gameOver = true;
                element.classList.add('correct');
                if (navigator.vibrate) navigator.vibrate([80, 50, 100]);
                handleVictory(isMe);
                
                const siblings = element.parentElement.children;
                for(let i=0; i<siblings.length; i++) {
                    if(i !== index) siblings[i].classList.add('fade-out');
                }
            } else {
                element.classList.add('wrong', 'disabled');
                if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
                
                document.getElementById('game-status').textContent = isMe ? "Wrong spot!" : `${partnerProfile.displayName} missed!`;
                
                lives--;
                updateLivesUI();
                if (!gameOver) {
                    activeTurn = activeTurn === 'host' ? 'guest' : 'host';
                    updateTurnUI();
                }
            }
        }

        function handleVictory(isMe) {
            document.getElementById('game-status').textContent = isMe ? "YOU FOUND THE MATCH!" : `${partnerProfile.displayName} FOUND IT!`;
            document.getElementById('turn-banner').textContent = "MATCH FOUND!";
            document.getElementById('turn-banner').classList.add('my-turn');
            
            if(isHost) setTimeout(() => { document.getElementById('restart-btn').style.display = 'block'; }, 800);
        }

        function handleLoss() {
            document.getElementById('game-status').textContent = "OUT OF LIVES! GAME OVER.";
            document.getElementById('turn-banner').textContent = "GAME OVER";
            document.getElementById('turn-banner').classList.remove('my-turn');
            
            const grid = document.getElementById('single-board');
            if(grid.children[targetIndex]) grid.children[targetIndex].classList.add('correct');
            
            if(isHost) setTimeout(() => { document.getElementById('restart-btn').style.display = 'block'; }, 800);
        }

        function exitGame() {
            activeConnection = null;
            document.getElementById('chat-messages').innerHTML = '<div class="chat-msg"><span class="sender">System</span>Connected to partner.</div>';
            renderFriendsList();
            showScreen('hub-screen');
        }

        function sendChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if(!msg) return;
            
            addChatMessage(myProfile.displayName, msg, true);
            if(activeConnection) activeConnection.send({ type: 'CHAT', message: msg });
            input.value = '';
        }

        function addChatMessage(sender, text, isMe) {
            const box = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = isMe ? 'chat-msg me' : 'chat-msg';
            msgDiv.innerHTML = `<span class="sender">${sender}</span>${text}`;
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }

        function addSystemChat(text) {
            const box = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg';
            msgDiv.innerHTML = `<span class="sender">System</span>${text}`;
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
