<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Same Spot - 2 Player Guessing Game</title>
    <!-- PeerJS for instant P2P online multiplayer without a backend -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --danger: #ef4444;
            --success: #22c55e;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin: 10px 0 5px 0;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 20px;
            text-align: center;
            max-width: 500px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #334155;
            color: white;
            border: 2px solid var(--primary);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: var(--primary);
            color: #0f172a;
        }

        .status-box {
            background: var(--card-bg);
            padding: 12px 24px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .lives {
            font-size: 1.3rem;
            letter-spacing: 2px;
        }

        .status-text {
            font-weight: 600;
            color: #cbd5e1;
        }

        /* 20 Circles Grid */
        .board-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            max-width: 480px;
            width: 100%;
        }

        .circle {
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--card-bg);
            border: 3px solid var(--primary);
            color: var(--text);
            font-size: 1.3rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .circle:hover:not(.disabled) {
            transform: scale(1.08);
            border-color: #818cf8;
            background: #334155;
        }

        .circle.disabled {
            cursor: not-allowed;
        }

        .circle.wrong {
            background: #7f1d1d;
            border-color: var(--danger);
            color: #fca5a5;
            opacity: 0.5;
        }

        .circle.correct {
            background: #14532d;
            border-color: var(--success);
            color: #86efac;
            transform: scale(1.15);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 10px var(--success); }
            100% { box-shadow: 0 0 25px var(--success); }
        }

        /* Local Test Split Screen */
        .split-view {
            display: none;
            gap: 40px;
            width: 100%;
            max-width: 1000px;
            justify-content: center;
        }

        .player-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        @media (max-width: 600px) {
            .board-container {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            .circle {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <h1>SAME SPOT</h1>
    <div class="subtitle">
        Find the <b>ONE</b> circle that has the exact same number in the exact same position on both players' boards!
    </div>

    <div class="controls">
        <button id="copy-btn" onclick="copyInviteLink()">📋 Copy Invite Link</button>
        <button id="restart-btn" onclick="resetGame()" style="display:none;">🔄 Play Again</button>
        <button onclick="toggleLocalMode()">🎮 Toggle Local 2-Player</button>
    </div>

    <div class="status-box">
        <div class="lives" id="lives-display">❤️❤️❤️</div>
        <div class="status-text" id="status-msg">Initializing room...</div>
    </div>

    <!-- Single Player Online View -->
    <div id="single-view" class="board-container"></div>

    <!-- Local Split View for testing on 1 screen -->
    <div id="local-view" class="split-view">
        <div class="player-column">
            <h3>Player 1 Board</h3>
            <div id="p1-board" class="board-container"></div>
        </div>
        <div class="player-column">
            <h3>Player 2 Board</h3>
            <div id="p2-board" class="board-container"></div>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let isHost = false;
        let myBoard = [];
        let targetIndex = -1;
        let lives = 3;
        let gameOver = false;
        let isLocalMode = false;

        // Initialize PeerJS
        function initPeer() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');

            peer = new Peer();

            peer.on('open', (id) => {
                if (!roomId) {
                    // Host mode
                    isHost = true;
                    document.getElementById('status-msg').innerText = "Waiting for Player 2 to join...";
                } else {
                    // Client mode
                    isHost = false;
                    document.getElementById('status-msg').innerText = "Connecting to Host...";
                    connectToHost(roomId);
                }
            });

            peer.on('connection', (c) => {
                if (isHost) {
                    conn = c;
                    setupConnection();
                    document.getElementById('status-msg').innerText = "Player 2 Connected! Game started.";
                    startNewOnlineGame();
                }
            });
        }

        function connectToHost(roomId) {
            conn = peer.connect(roomId);
            setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('status-msg').innerText = "Connected! Game starting...";
            });

            conn.on('data', (data) => {
                if (data.type === 'START_GAME') {
                    myBoard = data.board;
                    targetIndex = data.targetIndex;
                    lives = 3;
                    gameOver = false;
                    renderBoard('single-view', myBoard, handleOnlineClick);
                    updateLivesUI();
                    document.getElementById('status-msg').innerText = "Find the matching number!";
                } else if (data.type === 'PLAYER_WIN') {
                    gameOver = true;
                    document.getElementById('status-msg').innerText = "Other player found it first! You lose!";
                    highlightTarget();
                    document.getElementById('restart-btn').style.display = 'inline-block';
                }
            });
        }

        // Generate Board Data
        function generateGameData() {
            const target = Math.floor(Math.random() * 20);
            const targetNum = Math.floor(Math.random() * 89) + 10; // Random 2-digit number

            let p1Board = [];
            let p2Board = [];

            // Generate unique numbers
            let p1Pool = Array.from({length: 89}, (_, i) => i + 10).sort(() => Math.random() - 0.5);
            let p2Pool = Array.from({length: 89}, (_, i) => i + 10).sort(() => Math.random() - 0.5);

            for (let i = 0; i < 20; i++) {
                if (i === target) {
                    p1Board[i] = targetNum;
                    p2Board[i] = targetNum;
                } else {
                    p1Board[i] = p1Pool.pop();
                    p2Board[i] = p2Pool.pop();
                    // Avoid accidental match at non-target index
                    if (p1Board[i] === p2Board[i]) {
                        p2Board[i] += 1;
                    }
                }
            }

            return { targetIndex: target, p1Board, p2Board };
        }

        function startNewOnlineGame() {
            const data = generateGameData();
            targetIndex = data.targetIndex;
            myBoard = data.p1Board;
            lives = 3;
            gameOver = false;

            // Send board to Player 2
            conn.send({
                type: 'START_GAME',
                board: data.p2Board,
                targetIndex: data.targetIndex
            });

            renderBoard('single-view', myBoard, handleOnlineClick);
            updateLivesUI();
            document.getElementById('status-msg').innerText = "Find the matching number!";
            document.getElementById('restart-btn').style.display = 'none';
        }

        function handleOnlineClick(index, el) {
            if (gameOver || el.classList.contains('disabled')) return;

            if (index === targetIndex) {
                el.classList.add('correct');
                gameOver = true;
                document.getElementById('status-msg').innerText = "🎉 YOU WIN! You found the matching spot!";
                document.getElementById('restart-btn').style.display = 'inline-block';
                if (conn) conn.send({ type: 'PLAYER_WIN' });
            } else {
                el.classList.add('wrong', 'disabled');
                lives--;
                updateLivesUI();
                if (lives <= 0) {
                    gameOver = true;
                    document.getElementById('status-msg').innerText = "❌ Out of lives! Game Over.";
                    highlightTarget();
                    document.getElementById('restart-btn').style.display = 'inline-block';
                }
            }
        }

        function highlightTarget() {
            const container = isLocalMode ? document.getElementById('p1-board') : document.getElementById('single-view');
            const circles = container.getElementsByClassName('circle');
            if (circles[targetIndex]) {
                circles[targetIndex].classList.add('correct');
            }
        }

        function updateLivesUI() {
            let hearts = '';
            for (let i = 0; i < 3; i++) {
                hearts += i < lives ? '❤️' : '🖤';
            }
            document.getElementById('lives-display').innerText = hearts;
        }

        function renderBoard(containerId, boardData, clickHandler) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            boardData.forEach((num, index) => {
                const circle = document.createElement('div');
                circle.className = 'circle';
                circle.innerText = num;
                circle.onclick = () => clickHandler(index, circle);
                container.appendChild(circle);
            });
        }

        function copyInviteLink() {
            if (!peer || !peer.id) {
                alert("Connecting to server, please wait a second...");
                return;
            }
            const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${peer.id}`;
            navigator.clipboard.writeText(inviteUrl);
            alert("Invite link copied to clipboard! Send it to your friend to play.");
        }

        function resetGame() {
            if (isLocalMode) {
                startLocalGame();
            } else if (isHost) {
                startNewOnlineGame();
            } else {
                alert("Only the room host can restart the online match!");
            }
        }

        // Local Split-Screen Mode
        function toggleLocalMode() {
            isLocalMode = !isLocalMode;
            if (isLocalMode) {
                document.getElementById('single-view').style.display = 'none';
                document.getElementById('local-view').style.display = 'flex';
                document.getElementById('copy-btn').style.display = 'none';
                document.getElementById('restart-btn').style.display = 'inline-block';
                startLocalGame();
            } else {
                document.getElementById('single-view').style.display = 'grid';
                document.getElementById('local-view').style.display = 'none';
                document.getElementById('copy-btn').style.display = 'inline-block';
                document.getElementById('status-msg').innerText = "Switched to Online Mode.";
            }
        }

        function startLocalGame() {
            const data = generateGameData();
            targetIndex = data.targetIndex;
            lives = 3;
            gameOver = false;
            updateLivesUI();
            document.getElementById('status-msg').innerText = "Local 2-Player Mode: Find the matching spot!";

            renderBoard('p1-board', data.p1Board, (idx, el) => handleOnlineClick(idx, el));
            renderBoard('p2-board', data.p2Board, (idx, el) => handleOnlineClick(idx, el));
        }

        // Start initialization
        initPeer();
    </script>
</body>
</html>
